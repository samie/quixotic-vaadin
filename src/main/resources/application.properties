vaadin.launch-browser=true
spring.application.name=vaadin-quixotic

# ============================================================================
# Quixotic (jinfer) models, exposed through Spring AI interfaces.
#
# All inference is LOCAL and in-process -- no Python, no servers, no cloud keys.
# Each "model" value is a Hugging Face reference (owner/repo:QUANT) or a local
# GGUF path. A remote ref is resolved and DOWNLOADED on first startup, so the
# very first boot is slow and needs network + disk; later boots are offline.
#
# A capability's view in the UI only becomes functional once its model is set
# here (the views detect a missing model and show how to enable it).
# Comment a model out to skip downloading it.
# ============================================================================

# Model refs below mirror the Quixotic jbang examples. They all use app.* keys
# (not spring.ai.jinfer.*) so Jinfer's autoconfiguration never eagerly loads a model
# at boot. Each view's XxxModelService loads its model lazily in the background when
# the view opens, reporting Downloading → Loading → Warming up → Ready to the UI.
# Boot stays instant. Comment a model out to disable (and hide) its capability view.

# -- Chat (Chat view) ------------------------------------------------------
# Small, fast TEXT-only chat model (LFM2.5-350M) — the model the Quixotic README's
# `jinfer chat` command uses. Chosen for a responsive, well-behaved chat UX: it streams
# quickly on CPU and, unlike small Llama-3.2 Instruct builds, has no date-header quirk
# that makes the model ramble about dates.
app.chat.model=LiquidAI/LFM2.5-350M-GGUF:Q8_0
app.chat.context-capacity=4096
app.chat.max-tokens=512
app.chat.temperature=0.7

# -- Vision (Vision view) --------------------------------------------------
# Gemma-4 E2B multimodal model (matching the Quixotic Narrate.java example). The
# "media" companion is the multimodal projector (mmproj). Same model/mmproj as the
# Audio view below, so it only downloads once.
app.vision.model=unsloth/gemma-4-E2B-it-GGUF:Q8_0
app.vision.mmproj=unsloth/gemma-4-E2B-it-GGUF/mmproj-F32.gguf
app.vision.max-tokens=512

# -- Embeddings (Embed view) -----------------------------------------------
# Qwen3 embedding model, matching the Quixotic Search.java example.
app.embedding.model=Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0

# -- Text-to-speech (TextToSpeech view) ------------------------------------
# Inflect-Nano-v2 TTS, matching the Quixotic Speak.java example. The "lexicon"
# companion provides pronunciation data. Self-contained: unlike Kokoro it needs
# no external espeak-ng install, so the TextToSpeech view works out of the box.
app.speech.model=remixerdec/Inflect-Nano-v2-GGUF:Q8_0
app.speech.lexicon=remixerdec/Inflect-Nano-v2-GGUF/lexicon.bin

# -- Audio transcription (Audio view) --------------------------------------
# Multimodal chat model (Gemma-4 E2B, same family as the Quixotic Narrate.java example)
# that transcribes an uploaded audio clip from an "audio/wav" media part. The "media"
# companion is its mmproj projector. Uses the Q4_K_M quant (+ BF16 mmproj) for a
# responsive transcription UX rather than the slower Q8_0/F32.
app.audio.model=unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
app.audio.mmproj=unsloth/gemma-4-E2B-it-GGUF/mmproj-BF16.gguf
app.audio.max-tokens=512

# -- Speech-to-text / Parakeet (Speech to Text + Live Transcribe views) ----
# Dedicated Parakeet ASR model (real GGUF container, not a legacy ggml ".bin"), the same
# model as the Quixotic Transcribe.java example.
# Shared by the batch Speech to Text view and the live-streaming Live Transcribe view.
# Quants (same mudler repo): q8_0 (most accurate) → q4_k (fastest/smallest). We use q5_k,
# the speed/accuracy balance, for a responsive transcription UX (esp. live streaming).
app.transcription.model=mudler/parakeet-cpp-gguf/tdt-0.6b-v3-q5_k.gguf

# Live streaming chunk length in seconds (Live Transcribe view). A larger chunk
# lowers compute per second of speech (less left-context re-encoding) at the cost
# of higher latency; 6 minimizes the pause→text delay. Applied as the global
# -Djinfer.parakeet.chunkSeconds, so it also affects the batch Speech to Text view.
app.transcription.chunk-seconds=6

# Further jinfer speed levers are JVM system properties, passed as -D flags at
# launch (via the jinfer.jvm.args POM property or the spring-boot:run command line):
#   -Djinfer.threads=<N>        use all cores incl. Apple-Silicon E-cores (+~10%)
#   -Djinfer.vectorJit=fast     fast Vector-API path (GraalVM/JVMCI only)
# LiveTranscriptionService logs these when the model loads.
