# Vaadin MessageList typing indicator (setTypingUsers / "Thinking…") is a preview
# feature in Vaadin 25.3 and must be enabled explicitly. Used by ChatView.
com.vaadin.experimental.messageListTypingIndicator=true
# Vaadin AI integration (AIOrchestrator / SpringAILLMProvider) is a preview feature and
# must be enabled explicitly. Used by ChatView. Without it, the first prompt fails.
com.vaadin.experimental.aiComponents=true
